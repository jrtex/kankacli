[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kankacli"
version = "0.1.0"
description = "CLI tool for interacting with Kanka worldbuilding campaigns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "markdown>=3.6",
]

[project.scripts]
kankacli = "kankacli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["kankacli"]
